name: Read-only Discloud RAM audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_discloud_ram.py'
      - 'tests/test_audit_discloud_ram.py'
      - '.github/workflows/ram-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Observe account allocations without changing apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate read-only report
        run: python -m unittest discover -s tests -p 'test_audit_discloud_ram.py' -v
      - name: Read account and app memory
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: python scripts/audit_discloud_ram.py
