name: JARVIS Voice test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-voice-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Validate Python service and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small unit-test dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run tests and package checks
        run: |
          python -m compileall -q server.py scripts tests
          python -m unittest discover -s tests -v
          python scripts/verify_repo.py

  deploy:
    name: Provision or update dedicated Discloud voice app
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only Jarvis-Voice (create if missing)
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          JARVIS_VOICE_TOKEN: ${{ secrets.JARVIS_VOICE_TOKEN }}
        run: python scripts/deploy_discloud.py
      - name: Explain verification boundary
        run: echo "Discloud upload submitted. Real model inference, RAM, and private VLAN access still require host validation."
