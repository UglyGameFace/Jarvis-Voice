name: JARVIS Voice CI and Discloud deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Python tests and deploy package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lightweight test dependency only
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Compile and run unit tests
        run: |
          python -m compileall -q server.py tests
          python -m unittest discover -s tests -v
      - name: Reject credentials or model weights from tracked files
        run: python scripts/verify_repo.py

  deploy:
    name: Deploy to dedicated Discloud voice app
    needs: [tests]
    # Gate prevents first push from deploying an unbenchmarked model. Enable
    # the variable only after the dedicated app and real host are accepted.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.JARVIS_VOICE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: jarvis-voice-production
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated app credentials
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_VOICE_APP_ID: ${{ secrets.DISCLOUD_VOICE_APP_ID }}
        shell: bash
        run: |
          if [[ -z "$DISCLOUD_TOKEN" || -z "$DISCLOUD_VOICE_APP_ID" ]]; then
            echo '::error::Configure DISCLOUD_TOKEN and DISCLOUD_VOICE_APP_ID as repository Actions secrets before enabling deploy.'
            exit 1
          fi
      - name: Upload only runtime files to Discloud
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1, immutable commit
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_VOICE_APP_ID }}
          glob: |
            discloud.config
            server.py
            requirements.txt
      - name: Deployment handoff
        run: echo 'Files handed to Discloud; inspect service logs and authenticated on-host speech before claiming healthy production.'
